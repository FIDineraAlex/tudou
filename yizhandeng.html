<meta charset="utf-8">
<title>一盏灯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#07060b;
  --paper:#efe4cf;
  --paper-dim:#b9ab93;
  --cinnabar:#c23a2b;
  --lamp:#f2b04a;
  --line:#3a3346;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--ink);color:var(--paper);font-family:"Noto Serif SC","Songti SC","SimSun",serif;overflow:hidden;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#frame{position:relative;}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
#ov{position:absolute;inset:0;pointer-events:none;}
/* vertical caption with seal */
.vcap{position:absolute;top:9%;writing-mode:vertical-rl;font-family:"Ma Shan Zheng","KaiTi","STKaiti",serif;color:var(--paper);letter-spacing:.35em;text-shadow:0 0 .4em rgba(0,0,0,.7);transition:opacity 1s;}
.vcap .seal{display:inline-block;writing-mode:horizontal-tb;margin-top:.5em;background:var(--cinnabar);color:#f7e8d8;font-size:.55em;line-height:1;padding:.25em .22em;border-radius:.12em;letter-spacing:0;}
.narr{position:absolute;left:0;right:0;text-align:center;font-family:"Ma Shan Zheng","KaiTi",serif;color:var(--paper);text-shadow:0 0 .5em #000,0 0 .15em #000;transition:opacity 1.2s;letter-spacing:.12em;}
.big{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:"Ma Shan Zheng","KaiTi",serif;color:#fff;letter-spacing:.5em;text-shadow:0 0 .6em rgba(160,200,255,.9),0 0 .1em #000;}
#dlg{position:absolute;left:6%;right:6%;bottom:5%;padding:.7em 1.1em .8em;background:rgba(10,8,16,.82);border:2px solid #6b5a44;box-shadow:inset 0 0 0 2px #1a1522,0 0 0 2px #0b0910;opacity:0;transition:opacity .25s;}
#dlg .who{font-family:"Ma Shan Zheng","KaiTi",serif;font-size:1.15em;margin-bottom:.15em;letter-spacing:.1em;}
#dlg .txt{line-height:1.6;letter-spacing:.06em;min-height:1.6em;}
#dlg.echo{background:rgba(255,245,235,.12);border-color:rgba(255,240,230,.4);box-shadow:none;font-style:italic;}
/* start + end screens */
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10%;gap:.8em;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.55));pointer-events:auto;}
#cover button,#bar button{font-family:inherit;cursor:pointer;}
.play{font-size:1.05em;letter-spacing:.3em;color:var(--paper);background:rgba(20,14,22,.75);border:2px solid var(--lamp);padding:.55em 1.6em .55em 1.9em;box-shadow:0 0 0 2px #000,0 0 18px rgba(242,176,74,.35);}
.play:hover,.play:focus-visible{background:rgba(60,36,20,.85);outline:none;}
.hint{font-size:.8em;color:var(--paper-dim);letter-spacing:.15em;}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .4s;}
body.ui #bar{opacity:1;}
#bar button{background:none;border:1px solid var(--line);color:var(--paper);width:34px;height:30px;font-size:14px;}
#bar button:focus-visible{outline:2px solid var(--lamp);}
#prog{flex:1;height:6px;background:#2a2433;cursor:pointer;position:relative;}
#prog i{position:absolute;left:0;top:0;bottom:0;background:var(--lamp);}
#tm{font-size:12px;color:var(--paper-dim);font-variant-numeric:tabular-nums;min-width:84px;text-align:right;}
@media (prefers-reduced-motion:reduce){.vcap,.narr,#dlg{transition:none;}}
</style>
<div id="stage"><div id="frame">
  <canvas id="c" width="320" height="180"></canvas>

    <div id="dlg"><div class="who"></div><div class="txt"></div></div>
  </div>

</div></div>
<div id="bar">

  <span id="tm">0:00 / 0:00</span>

</div>
<script>
"use strict";
// ================= core utils =================
const W=320,H=180;
const cv=document.getElementById('c');const G=cv.getContext('2d');G.imageSmoothingEnabled=false;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-(1-t)*(1-t);
const easeIn=t=>t*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const D2R=Math.PI/180;
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function hash2(a,b){return hash(a*57.13+b*13.71);}
function vnoise(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i+s*101),hash(i+1+s*101),u);}
function fbm(x,s,o){let v=0,a=.5,f=1;for(let k=0;k<(o||4);k++){v+=a*vnoise(x*f,s+k);a*=.5;f*=2;}return v;}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bay=(x,y)=>BAYER[(y&3)*4+(x&3)];
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');}
// pixel primitives
function px(g,x,y,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),1,1);}
function rect(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function line(g,x0,y0,x1,y1,c,w){
  g.fillStyle=c;w=w||1;x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,o=(w-1)>>1;
  for(let i=0;i<400;i++){g.fillRect(x0-o,y0-o,w,w);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}
}
function poly(g,pts,c,dith){
  // scanline fill, pts=[[x,y],...]; dith: 0..1 density via bayer
  let minY=1e9,maxY=-1e9;for(const p of pts){if(p[1]<minY)minY=p[1];if(p[1]>maxY)maxY=p[1];}
  g.fillStyle=c;const n=pts.length;
  for(let y=Math.floor(minY);y<=Math.ceil(maxY);y++){
    const sy=y+.5,xs=[];
    for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];if((a[1]<=sy&&b[1]>sy)||(b[1]<=sy&&a[1]>sy)){xs.push(a[0]+(sy-a[1])/(b[1]-a[1])*(b[0]-a[0]));}}
    xs.sort((p,q)=>p-q);
    for(let k=0;k+1<xs.length;k+=2){const x0=Math.round(xs[k]),x1=Math.round(xs[k+1]);if(x1<=x0)continue;
      if(dith==null)g.fillRect(x0,y,x1-x0,1);else for(let x=x0;x<x1;x++)if(bay(x,y)<dith)g.fillRect(x,y,1,1);}
  }
}
function ell(g,cx,cy,rx,ry,c,dith){
  g.fillStyle=c;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++){const d=(y+.5-cy)/ry;if(Math.abs(d)>1)continue;const hw=rx*Math.sqrt(1-d*d);const x0=Math.round(cx-hw),x1=Math.round(cx+hw);
    if(dith==null)g.fillRect(x0,y,x1-x0,1);else for(let x=x0;x<x1;x++)if(bay(x,y)<dith)g.fillRect(x,y,1,1);}
}
// tapered strand along quadratic curve
function strand(g,x0,y0,cx,cy,x1,y1,w0,w1,c){
  const L=[],R=[],N=10;
  for(let i=0;i<=N;i++){const t=i/N,u=1-t;const x=u*u*x0+2*u*t*cx+t*t*x1,y=u*u*y0+2*u*t*cy+t*t*y1;
    const dx=2*u*(cx-x0)+2*t*(x1-cx),dy=2*u*(cy-y0)+2*t*(y1-cy);const l=Math.hypot(dx,dy)||1;const w=lerp(w0,w1,t)/2;
    L.push([x-dy/l*w,y+dx/l*w]);R.push([x+dy/l*w,y-dx/l*w]);}
  poly(g,L.concat(R.reverse()),c);
}
// sprite from strings
function spr(g,rows,pal,x,y,flip){for(let r=0;r<rows.length;r++){const s=rows[r];for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='.'||ch===' ')continue;const c=pal[ch];if(!c)continue;g.fillStyle=c;g.fillRect(flip?x+s.length-1-i:x+i,y+r,1,1);}}}
// dither fade patterns
const DPAT=[];(function(){for(let l=0;l<=16;l++){const [c,x]=mk(4,4);x.fillStyle='#000';for(let yy=0;yy<4;yy++)for(let xx=0;xx<4;xx++)if(BAYER[yy*4+xx]<l/16)x.fillRect(xx,yy,1,1);DPAT.push(c);}})();
function dfade(g,a,col){a=clamp(a,0,1);if(a<=0)return;const l=Math.round(a*16);if(l>=16){g.fillStyle=col||'#000';g.fillRect(0,0,W,H);return;}
  if(!col)col='#000';
  g.save();g.globalAlpha=l/16;g.fillStyle=col;g.fillRect(0,0,W,H);g.restore();}
// dithered radial light (additive-ish), color string
function glow(g,cx,cy,r,col,str,flick){const R=r*(flick||1);g.save();g.globalCompositeOperation='lighter';for(let k=0;k<4;k++){g.globalAlpha=clamp(str*.16,0,.3);ell(g,Math.round(cx),Math.round(cy),Math.round(R*(1-k*.22)),Math.round(R*(1-k*.22)),col);}g.restore();}
</script>
<script>
// ================= backgrounds =================
function gradFill(img,w,y0,y1,stops,xoff){
  const d=img.data,IW=img.width;const cs=stops.map(s=>[s[0],hex(s[1])]);
  for(let y=Math.max(0,y0);y<y1;y++){const p=(y-y0)/(y1-y0);let k=0;while(k<cs.length-2&&p>cs[k+1][0])k++;
    const a=cs[k],b=cs[k+1];const t=clamp((p-a[0])/(b[0]-a[0]),0,1);
    const cc=[0,1,2].map(j=>lerp(a[1][j],b[1][j],t));for(let x=0;x<w;x++){const o=(bay(x+(xoff||0),y)-.5)*9;const i=(y*IW+x)*4;for(let j=0;j<3;j++)d[i+j]=clamp(Math.round((cc[j]+o)/9)*9,0,255);d[i+3]=255;}}
}
function setp(img,x,y,c){if(x<0||y<0||x>=img.width||y>=img.height)return;const i=(y*img.width+x)*4,d=img.data;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}
function getp(img,x,y){const i=(y*img.width+x)*4,d=img.data;return [d[i],d[i+1],d[i+2]];}
function ridge(img,w,seed,base,amp,col,hi,snowcap,hazeCol){
  const C=hex(col),HI=hi?hex(hi):null,HZ=hazeCol?hex(hazeCol):null,SN=hex('#e8eef8');
  for(let x=0;x<w;x++){
    const r=fbm(x/60,seed,5);const pk=Math.pow(Math.abs(Math.sin(x/47+seed)),3)*.35;
    const top=Math.round(base-amp*(r*.9+pk));
    for(let y=top;y<img.height;y++){
      let c=C;
      if(HZ){const hz=clamp((y-top)/(amp*1.1),0,1)*.8;if(bay(x,y)<hz)c=HZ;}
      if(HI&&y<top+2&&hash2(x,seed)>.35)c=HI;
      if(snowcap&&y<top+Math.max(0,(base-amp*.55)-top)*.8&&bay(x,y)<.85)c=SN;
      setp(img,x,y,c);
    }
  }
}
const LK={};// lakeside scene canvases by mode
function buildLakeside(mode){
  const Wd=320,Hd=240;const [c,g]=mk(Wd,Hd);const img=g.createImageData(Wd,Hd);
  const P={
    dusk:{sky:[[0,'#1f1838'],[.3,'#4a2f5e'],[.55,'#a34f72'],[.78,'#ec8a6c'],[1,'#ffcf8e']],m:['#9a6385','#6a4270','#3d2a50'],mh:['#c67c8c','#8a5680','#56386a'],haze:'#d08090'},
    snow:{sky:[[0,'#0a0c1a'],[.5,'#1a2038'],[1,'#34405e']],m:['#3a4666','#2a3350','#1c2238'],mh:['#5a6a8c','#46547a','#343e5c'],haze:'#46527a'},
    day:{sky:[[0,'#3d7cc8'],[.55,'#86bce8'],[1,'#dff0f4']],m:['#a4bcd8','#7f9cc0','#5f7ea4'],mh:['#c8d8ea','#a4bcd8','#86a2c2'],haze:'#c8dcec'}
  }[mode];
  gradFill(img,Wd,0,172,P.sky);
  // stars for snow night (sparse), sun for dusk
  if(mode==='snow'){for(let i=0;i<60;i++){const x=Math.floor(hash(i)*Wd),y=Math.floor(hash(i+99)*120);if(hash(i+7)>.5)setp(img,x,y,hex('#8890b0'));}}
  if(mode==='dusk'){const sx=236,sy=150;for(let y=sy-40;y<sy+20;y++)for(let x=sx-40;x<sx+40;x++){const d=Math.hypot(x-sx,y-sy);if(d<17)setp(img,x,y,hex(d<15?'#fff0c0':'#ffd896'));else if(d<34&&bay(x,y)<(1-(d-17)/17)*.5)setp(img,x,y,hex('#ffc488'));}}
  if(mode==='day'){ // clouds
    const cl=[[60,40,1],[200,26,1.3],[290,60,.8]];
    for(const [cx,cy,s] of cl){for(let k=0;k<7;k++){const ox=(hash(k+cx)-.5)*40*s,oy=(hash(k+cy)-.5)*8*s,r=(8+hash(k*3+cx)*9)*s;
      for(let y=Math.floor(cy+oy-r);y<cy+oy+r;y++)for(let x=Math.floor(cx+ox-r*1.6);x<cx+ox+r*1.6;x++){const dd=Math.hypot((x-cx-ox)/1.6,y-cy-oy);if(dd<r&&y<cy+6*s)setp(img,x,y,hex(y<cy+oy-r*.4?'#ffffff':(bay(x,y)<.5?'#eef6fb':'#d4e6f2')));}}}}
  // mountains
  ridge(img,Wd,3,138,34,P.m[0],P.mh[0],mode==='snow',P.haze);
  ridge(img,Wd,7,152,28,P.m[1],P.mh[1],mode==='snow',P.haze);
  ridge(img,Wd,11,166,20,P.m[2],P.mh[2],mode==='snow',null);
  // lake 170-196 reflection
  for(let y=170;y<198;y++){const my=170-(y-170)*2.2;for(let x=0;x<Wd;x++){let s=getp(img,x,clamp(Math.round(my),0,169));
      const dk=mode==='snow'?.55:.72;let r=[s[0]*dk,s[1]*dk,s[2]*dk+ (mode==='snow'?14:10)];
      if(mode==='snow'){r=[140,152,178];if(bay(x,y)<.35)r=[118,130,160];if(hash2(Math.floor(x/9),y)>.93)r=[196,206,224];}
      if(mode!=='snow'&&hash2(Math.floor(x/6)+y*31,y)>.9)r=[r[0]*1.25,r[1]*1.2,r[2]*1.15];
      setp(img,x,y,r.map(v=>clamp(Math.round(v),0,255)));}}
  // ground
  const GC={dusk:['#3e4a34','#56603c','#2c3528','#8a6450','#6e4e40','#a07a5a'],snow:['#b8c6de','#dce6f4','#8a9abc','#a2b0cc','#8898b8','#c4d0e4'],day:['#4f8a44','#6aa452','#3a6a36','#b48c64','#94704e','#ccaa7c']}[mode];
  const gc=GC.map(hex);
  for(let x=0;x<Wd;x++){const top=194+Math.round(Math.sin(x/23)*1.5+vnoise(x/9,5)*2);
    for(let y=top;y<Hd;y++){let c=gc[0];if(y<top+2)c=gc[1];else if(bay(x,y)<.18)c=gc[2];
      const pc=Math.abs(y-219)+vnoise(x/7,9)*3;if(pc<7){c=gc[3];if(pc>5.2&&bay(x,y)<.5)c=gc[4];if(hash2(x,y)>.94)c=gc[5];}
      setp(img,x,y,c);}
    if(mode!=='snow'&&hash(x*3.1)>.8){const h=2+Math.floor(hash(x)*4);for(let k=0;k<h;k++)setp(img,x,top-k,gc[k%2?1:2]);}
  }
  g.putImageData(img,0,0);
  // reeds & stones by the lake (right side)
  for(let i=0;i<18;i++){const x=150+Math.floor(hash(i*5)*160),h=6+hash(i)*10;const col=mode==='snow'?'#6a7898':mode==='day'?'#6a8a3a':'#4a4a30';line(g,x,195,x+(hash(i+2)-.5)*4,195-h,col);if(mode!=='snow')px(g,x+(hash(i+2)-.5)*4,195-h,mode==='day'?'#a08a50':'#8a6040');}
  for(let i=0;i<5;i++){const x=175+i*28+hash(i)*10;ell(g,x,197,5,2.5,mode==='snow'?'#e0e8f4':'#5a5460');ell(g,x-1,196,3,1.2,mode==='snow'?'#ffffff':'#7a7280');}
  // ---- house ----
  const wall={dusk:'#d9b9a6',snow:'#6c7494',day:'#efe6d4'}[mode],wallS={dusk:'#b8927e',snow:'#545c7a',day:'#d4c6ae'}[mode];
  const wood={dusk:'#4a2c26',snow:'#2a2434',day:'#5a3a2a'}[mode];
  rect(g,8,176,104,38,wall);rect(g,8,176,104,5,wallS);
  for(let x of [8,36,84,110])rect(g,x,176,3,38,wood);rect(g,8,196,104,2,wood);
  rect(g,4,211,112,4,{dusk:'#5c5060',snow:'#3a3c52',day:'#7a7280'}[mode]);
  // door
  rect(g,56,186,22,26,wood);rect(g,58,188,8,22,{dusk:'#6a4232',snow:'#3a3040',day:'#7a4e36'}[mode]);rect(g,68,188,8,22,{dusk:'#6a4232',snow:'#3a3040',day:'#7a4e36'}[mode]);px(g,65,199,'#c8a040');px(g,69,199,'#c8a040');
  // round window lattice
  const winLit=mode==='snow';ell(g,22,193,8,8,wood);ell(g,22,193,6.5,6.5,winLit?'#f4b85a':(mode==='dusk'?'#f0c08a':'#3a3040'));
  for(let k=-6;k<=6;k+=3){line(g,22+k,187,22+k,199,wood);line(g,16,193+k,28,193+k,wood);}
  // couplet paper strips by door
  rect(g,51,186,3,20,'#b8322a');rect(g,80,186,3,20,'#b8322a');
  // roof
  const roofC={dusk:'#3a3448',snow:'#2c3048',day:'#46505e'}[mode],roofL={dusk:'#5a5068',snow:'#44486a',day:'#66727e'}[mode];
  const roof=[[-6,179],[2,175],[12,162],[18,154],[102,154],[108,162],[118,175],[126,179],[120,181],[0,181]];
  poly(g,roof,roofC);
  for(let y=157;y<180;y+=3){line(g,-2,y,122,y,roofL);}
  for(let x=0;x<122;x+=4)line(g,x,155,x+(x-60)*.12,180,roofC);
  rect(g,-4,178,128,3,wood);
  // ridge + upturned ends
  rect(g,16,151,88,4,'#221e2c');strand(g,17,152,12,150,8,144,3,1,'#221e2c');strand(g,103,152,108,150,112,144,3,1,'#221e2c');
  strand(g,1,177,-3,176,-6,171,3,1,'#221e2c');strand(g,119,177,123,176,126,171,3,1,'#221e2c');
  if(mode==='snow'){ // snow on roof & icicles
    poly(g,[[-6,178],[2,174],[12,161],[18,153],[102,153],[108,161],[118,174],[126,178],[118,176],[106,164],[96,158],[60,160],[20,158],[12,165],[2,176]],'#e4ecf8');
    rect(g,16,149,88,3,'#f4f8ff');for(let x=2;x<120;x+=3){const l=1+Math.floor(hash(x)*4);line(g,x,181,x,181+l,'#c8d8f0');}
    rect(g,4,209,112,2,'#e4ecf8');
  }
  // lantern post
  rect(g,128,184,3,32,wood);rect(g,128,184,12,2,wood);px(g,138,186,'#222');
  // ---- peach tree ----

bPlay.addEventListener('click',()=>{if(!started)return start();if(T>=TOTAL-.05){seek(0);}setPlaying(!playing);});
document.getElementById('bRe').addEventListener('click',()=>{if(!started)return start();cover.hidden=true;seek(0);setPlaying(true);});
bMute.addEventListener('click',()=>{muted=!muted;bMute.textContent=muted?'✕':'♪';if(OUT)OUT.gain.setTargetAtTime(muted?0:1,AC.currentTime,.05);});
prog.addEventListener('click',e=>{if(!started)return;const r=prog.getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOTAL);});
addEventListener('keydown',e=>{if(!started)return;if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}else if(e.code==='ArrowRight')seek(T+5);else if(e.code==='ArrowLeft')seek(T-5);else if(e.code==='KeyM')bMute.click();});
let uiTimer=0;function poke(){document.body.classList.add('ui');clearTimeout(uiTimer);uiTimer=setTimeout(()=>{if(playing)document.body.classList.remove('ui');},2600);}
addEventListener('mousemove',poke);addEventListener('touchstart',poke,{passive:true});
function resize(){const fr=document.getElementById('frame');let s=Math.min(innerWidth/W,innerHeight/H);if(s>=3)s=Math.floor(s);
  fr.style.width=Math.floor(W*s)+'px';fr.style.height=Math.floor(H*s)+'px';fr.style.fontSize=Math.max(11,H*s/28)+'px';}
addEventListener('resize',resize);resize();
function loop(now){const dt=Math.min(100,now-(last||now))/1000;last=now;
  if(playing){T+=dt;audioPump(T);if(T>=TOTAL){T=TOTAL-.01;playing=false;bPlay.textContent='▶';startBtn.textContent='↺ 重 播';cover.hidden=false;document.body.classList.add('ui');}}
  if(playing||!started||window.__dirty){render(started?T:4.2);window.__dirty=false;}
  progI.style.width=(T/TOTAL*100)+'%';tm.textContent=fmt(T)+' / '+fmt(TOTAL);
  requestAnimationFrame(loop);}
window.__seek=t=>{started=true;cover.hidden=true;playing=false;T=t;render(T);};
if(/^#t\d+/.test(location.hash)){const t=parseFloat(location.hash.slice(2));setTimeout(()=>__seek(t),50);}
requestAnimationFrame(loop);

</script>
